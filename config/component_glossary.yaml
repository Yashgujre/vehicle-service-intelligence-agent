# One-line scope notes per component, shown to the LLM so it applies NHTSA's coding conventions.
# Written from NHTSA component names and common complaint patterns; refine from review corrections.
AIR BAGS: "air bag deployment or non-deployment, air bag warning light, occupant classification sensor"
BACK OVER PREVENTION: "rear-view camera, backup camera image missing or frozen, rear parking sensors"
ELECTRICAL SYSTEM: "12V battery, wiring, fuses, modules, traction (high-voltage) battery, charging port and on-board charger, center screen or instrument cluster going dark, warning messages from electrical faults"
ELECTRONIC STABILITY CONTROL: "stability or traction control intervening or failing"
ENGINE: "internal combustion engine faults, engine stalling or misfire in hybrids, oil or coolant leaks from the engine"
EXTERIOR LIGHTING: "headlights, tail lights, turn signals, brake lights, daytime running lights"
FORWARD COLLISION AVOIDANCE: "automatic emergency braking, phantom or sudden braking with no obstacle, forward collision warnings"
FUEL/PROPULSION SYSTEM: "fuel leaks, fuel pump, fuel gauge, propulsion fuel delivery in hybrids"
HYBRID PROPULSION SYSTEM: "hybrid drive system faults coded specifically as hybrid propulsion"
LANE DEPARTURE: "lane keeping assist, lane centering steering on its own, lane departure warnings"
LATCHES/LOCKS/LINKAGES: "door latches, door handles, hood or trunk latches, locks failing to open or close"
PARKING BRAKE: "electronic parking brake engaging or failing to release"
POWER TRAIN: "electric drive unit, motor, gear selector or shifter, park mechanism, sudden loss of drive power, vehicle rolling when in park, half shafts"
SEAT BELTS: "belts, buckles, pretensioners, seat belt warnings"
SEATS: "seat frames, seat adjustment, seat heaters"
SERVICE BRAKES: "brake pedal, regenerative braking feel, brake failure, brake noise, ABS"
STEERING: "steering wheel, power steering assist loss, steering rack, steer-by-wire faults"
STRUCTURE: "body panels, frame, roof, trim pieces detaching, glass or sunroof breaking, water leaks into the cabin"
SUSPENSION: "control arms, ball joints, shocks, air suspension, alignment, clunks over bumps"
TIRES: "tire failures, blowouts, sidewall bulges, tire pressure monitoring"
VEHICLE SPEED CONTROL: "cruise control, adaptive cruise, unintended or sudden acceleration, accelerator pedal"
VISIBILITY/WIPER: "windshield wipers, defrost, mirrors, windshield glass, side cameras, glare"
WHEELS: "wheels, lug nuts, wheel bearings, hubcaps"
OTHER: "anything not covered above, or not enough information to tell"
