[project]
name = "vsia"
version = "0.1.0"
description = "Vehicle Service Intelligence Agent: complaint triage, recall linking, RAG chat and spike forecasting on public NHTSA data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "rank-bm25>=0.2.2",
  "pypdf>=4.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "tenacity>=8.3",
  "jsonschema>=4.22",
  "tabulate>=0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
cloud = ["anthropic>=0.40", "openai>=1.50", "pinecone>=5.0"]
mlops = ["mlflow>=2.14"]
app = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
vsia = "vsia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
